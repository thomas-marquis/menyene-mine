app:
  name: menyene-mine
  debug: false
  cors_origins: "https://menyene-mine.com,https://api.menyene-mine.com"

database:
  url: $DATABASE_URL

ai:
  enabled: true
  model: mistral-medium
  max_drafts: 3
  temperature: 0.5
  api_key: $MISTRAL_API_KEY

judge:
  enabled: true
  model: $JUDGE_MODEL
  temperature: 0.1
  max_tokens: 5000
