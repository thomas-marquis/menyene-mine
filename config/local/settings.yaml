app:
  name: menyene-mine
  debug: true
  cors_origins: "http://localhost:3000,http://localhost:5173"

database:
  url: "sqlite+aiosqlite:///./menyene_mine.db"

ai:
  enabled: true
  model: mistral-small-latest
  max_drafts: 1
  temperature: 0.7
  api_key: $MISTRAL_API_KEY

judge:
  enabled: true
  model: $JUDGE_MODEL
  temperature: 0.1
  max_tokens: 5000
