app:
  name: menyene-mine
  debug: false
  cors_origins: "http://localhost:3000,http://localhost:5173"

database:
  url: "sqlite+aiosqlite:///./menyene_mine.db"

ai:
  enabled: false
  model: mistral-medium
  max_drafts: 1
  temperature: 0.7
  mistral_api_key: $MISTRAL_API_KEY

judge:
  enabled: true
  model: $JUDGE_MODEL
  temperature: 0.3
  max_tokens: 500
