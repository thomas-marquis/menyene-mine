[project]
name = "menyene_mine"
version = "0.1.0"
description = "menyene-mine - a fastapi project"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings",
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "alembic",
    "aiosqlite",
]

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-cov>=7.1.0",
    "httpx",
    "behave",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
